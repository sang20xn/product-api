name: Product API CI - Production Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: 123456
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --host localhost --port 27017 -u admin -p 123456 --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Product API
        run: node server.js &
        env:
          PORT: 3000
          MONGO_HOST: localhost
          MONGO_PORT: 27017
          MONGO_DATABASE: productdb
          MONGO_USERNAME: admin
          MONGO_PASSWORD: 123456

      - name: Wait for Product API
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Test Create Product
        run: |
          curl -f -X POST http://localhost:3000/api/products \
            -H "Content-Type: application/json" \
            -d '{"pid":"CI001","pname":"CI Laptop","price":15000000,"quantity":10}'

      - name: Test Get Products
        run: |
          curl -f http://localhost:3000/api/products

      - name: Test Update Product
        run: |
          curl -f -X PUT http://localhost:3000/api/products/CI001 \
            -H "Content-Type: application/json" \
            -d '{"pname":"CI Laptop Updated","price":16000000,"quantity":8}'

      - name: Test Get Product By ID
        run: |
          curl -f http://localhost:3000/api/products/CI001

      - name: Test Delete Product
        run: |
          curl -f -X DELETE http://localhost:3000/api/products/CI001